plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    // The mod id stays "arrowslot" for save/data compatibility, but the project and
    // produced jar use the Chest Rig name.
    archivesName = 'chest_rig'
}

// The Java toolchain is version-driven so a newer Minecraft target can override
// java_version in gradle.properties without editing this script.
java.toolchain.languageVersion = JavaLanguageVersion.of((project.findProperty('java_version') ?: '21').toString().toInteger())

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

// ---------------------------------------------------------------------------
// Versioned development-run layout.
//
// Game files, options, worlds and dev-only mods are isolated per side, loader
// and Minecraft version:
//
//     run/<side>/<loader>/<minecraft_version>/
//
// The existing run/client/neoforge/1.21.1 and run/server/neoforge/1.21.1
// directories are the reference layout. Keep minecraft_version and mod_loader in
// gradle.properties as the single source of truth so a second version can be
// tested without mixing its config, logs or mods with this one.
// ---------------------------------------------------------------------------
def runRootName = (project.findProperty('run_root') ?: 'run').toString()
def modLoader = (project.findProperty('mod_loader') ?: 'neoforge').toString()
def targetMinecraftVersion = (project.findProperty('minecraft_version') ?: '1.21.1').toString()
def runRootDir = layout.projectDirectory.dir(runRootName)
def runGameDir = { String side ->
    runRootDir.dir("${side}/${modLoader}/${targetMinecraftVersion}")
}

// Optional per-version source overlays. The shared src/main tree stays the
// baseline; src/versions/<minecraft_version>/java and .../resources are added
// only when that folder exists, so a second target can carry small API or asset
// differences without moving the whole project.
def versionSourceRoot = layout.projectDirectory.dir("src/versions/${targetMinecraftVersion}")
if (versionSourceRoot.asFile.isDirectory()) {
    sourceSets.main.java.srcDir(versionSourceRoot.dir('java'))
    sourceSets.main.resources.srcDir(versionSourceRoot.dir('resources'))
}

dependencies {
    // Jade base support is kept as before. The chest-rig counter integration now lives in
    // the client HUD instead, but the Jade dependency stays available for future use.
    compileOnly "maven.modrinth:jade:eYz2YBGT"

    // Development-run mods. These are optional at runtime and are not shipped with the
    // mod. They are runtimeOnly, so both runClient and runServer load them in the dev
    // environment; this is intentional so the client Mod List matches the test setup.
    runtimeOnly "maven.modrinth:jade:eYz2YBGT"
    runtimeOnly "maven.modrinth:jei:tlisIOnf"
    runtimeOnly "maven.modrinth:jade-addons-forge:O3F6Dkle"
    runtimeOnly "maven.modrinth:appleskin:uAKA6Laj"

}

// These mod jars are not published on the Modrinth Maven. FML only discovers
// jars under the active game directory, so they are copied into each versioned
// <gameDir>/mods directory. A cache and the old run/mods directory are both
// recognised; the old shared directory is only a migration source and is never
// used by the versioned runs.
def devModDownloadsByMinecraftVersion = [
        '1.21.1': [
                "mezz_config-1.21.1-neoforge-0.7.1-standalone.jar":
                        "https://cdn.modrinth.com/data/7tEfOcA7/versions/V6oWFnxW/mezz_config-1.21.1-neoforge-0.7.1-standalone.jar",
                "mezz_config_gui-1.21.1-neoforge-mc1.21.1-0.7.1.jar":
                        "https://cdn.modrinth.com/data/BOHUKqOz/versions/w3KJAJXs/mezz_config_gui-1.21.1-neoforge-mc1.21.1-0.7.1.jar"
        ]
]
def devModDownloads = devModDownloadsByMinecraftVersion[targetMinecraftVersion]
if (devModDownloads == null) {
    logger.warn("No dev-only mod download set is registered for Minecraft " + targetMinecraftVersion + "; downloadDevMods will be a no-op.")
    devModDownloads = [:]
}
def devModsDirs = ['client', 'server'].collect { side ->
    runGameDir(side).dir('mods').asFile
}
def devModCacheDir = new File(runRootDir.asFile, '.cache/dev-mods')
def legacyModsDir = new File(runRootDir.asFile, 'mods')

tasks.register("downloadDevMods") {
    group = 'mod development'
    description = 'Downloads dev-only mod jars into the versioned client/server mods directories.'

    doLast {
        devModCacheDir.mkdirs()
        devModDownloads.each { fileName, url ->
            def cached = new File(devModCacheDir, fileName)
            if (!cached.isFile() || cached.length() == 0) {
                def legacy = new File(legacyModsDir, fileName)
                if (legacy.isFile() && legacy.length() > 0) {
                    logger.lifecycle("Migrating " + fileName + " from " + legacyModsDir)
                    cached.withOutputStream { output ->
                        legacy.withInputStream { input ->
                            output << input
                        }
                    }
                } else {
                    def partial = new File(devModCacheDir, fileName + '.part')
                    partial.delete()
                    logger.lifecycle("Downloading " + fileName)
                    new URL(url).withInputStream { input ->
                        partial.withOutputStream { output ->
                            output << input
                        }
                    }
                    if (cached.exists()) {
                        cached.delete()
                    }
                    if (!partial.renameTo(cached)) {
                        throw new GradleException("Could not move " + partial + " to " + cached)
                    }
                }
            }

            devModsDirs.each { modsDir ->
                modsDir.mkdirs()
                def target = new File(modsDir, fileName)
                if (!target.isFile() || target.length() != cached.length()) {
                    target.withOutputStream { output ->
                        cached.withInputStream { input ->
                            output << input
                        }
                    }
                }
            }
        }
    }
}

tasks.register("printRunLayout") {
    group = 'help'
    description = 'Prints the resolved versioned run and mods directories.'

    doLast {
        logger.lifecycle("Run root: " + runRootDir.asFile)
        ['client', 'server'].each { side ->
            def gameDir = runGameDir(side).asFile
            logger.lifecycle("  " + side + " game: " + gameDir)
            logger.lifecycle("  " + side + " mods: " + new File(gameDir, 'mods'))
        }
    }
}

tasks.matching { it.name == "runClient" || it.name == "runServer" }.configureEach {
    dependsOn "downloadDevMods"
}

neoForge {
    version = project.neo_version

    // The inventory-menu mixin adds the chest-rig row and adjusts the vanilla layout.
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            gameDirectory.set(runGameDir('client'))
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            gameDirectory.set(runGameDir('server'))
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// ---------------------------------------------------------------------------
// Mod metadata.
//
// The authoritative metadata lives in src/main/templates and is expanded by
// generateModMetadata. FML also needs META-INF/neoforge.mods.toml next to the
// compiled classes for development runs, so the expanded file is copied there too.
// ---------------------------------------------------------------------------
task generateModMetadata(type: ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

def copyModMetadataForDev = tasks.register('copyModMetadataForDev', Copy) {
    from generateModMetadata
    into layout.buildDirectory.dir('classes/java/main')
    include 'META-INF/neoforge.mods.toml'
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// compileJava and processResources both run before "classes".
classes {
    dependsOn copyModMetadataForDev
}

// IntelliJ launches the game through a JavaExec task generated in an init script.
// That task consumes build/classes/java/main, which the copy task above writes to,
// so the ordering has to be declared or Gradle rejects the implicit dependency.
tasks.withType(JavaExec).configureEach {
    mustRunAfter copyModMetadataForDev
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Let the IDE and the build see the generated template output.
// This order matters: srcDir() also wires the task as a dependency of processResources,
// so the expanded metadata exists before resources are copied.
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar) {
    // The development metadata copy also lands in classes/java/main; the generated
    // resources copy is identical, so keep only one entry in the final jar.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : 'wlsnb',
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : 'wlsnb'
        ])
    }
}
