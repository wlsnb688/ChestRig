# Gradle settings
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Development run layout
# game/config/log/mods directories are isolated per side, loader and Minecraft version:
# run/<side>/<loader>/<minecraft_version>/
run_root=run
# Loader segment used by the run path and artifact name. The current build is
# NeoForge-only; another loader needs its own build scripts/branch.
mod_loader=neoforge

# Java toolchain for the target Minecraft version
java_version=21

# Minecraft / loader target
# Game target. Changing this also selects run/<side>/<loader>/<version>/ and the
# optional src/versions/<version> source overlay. Override per build with
# -Pminecraft_version=... together with the matching ranges and mappings.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Exact loader build used to compile and run. Override per build with
# -Ploader_version=...
loader_version=21.1.267
loader_version_range=[1,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Mod metadata
mod_id=arrowslot
mod_name=Chest Rig
mod_license=AGPL-3.0-only
# The mod's own version. It belongs to the current git branch and is not a
# build-matrix dimension; bump it on that branch when releasing.
mod_version=0.1.0-Alpha
mod_group_id=com.wlsnb.arrowslot
